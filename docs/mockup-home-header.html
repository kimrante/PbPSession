<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PbP · 목업 — 메인(방 목록) 상단 바 센터 정렬 (확정)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gowun+Batang:wght@400;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
/* 디자인 토큰 — 라이트 모드 + v2 스페이싱.
   디자인 원칙: 센터 정렬 기본 · 패딩/마진 상하 동일 · 동류 항목은 같은 여백값.
   상단 바 규격은 채팅 상단 바(mockup-chat-header.html)와 완전 동일:
   높이 56 · 묶음 정중앙 · 1행(제목)↔2행(부제) 3px · 부제 11px rgba(20,25,32,.72) 500 */
:root{
  --bg:#f4f2ec; --panel:#ffffff; --panel-2:#efeade;
  --line:rgba(20,25,32,.10); --ink:#23272e;
  --ink-sub:rgba(20,25,32,.72);
  --ink-dim:#6d7480; --postit:#ffd05c;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
  --r-cell:12px; --r-card:16px; --r-pill:999px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#e9e5db;color:var(--ink);
  font-family:'Noto Sans KR',system-ui,sans-serif,'Noto Color Emoji';
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px;
}
.phone{width:340px;flex-shrink:0;background:#05070a;border-radius:38px;border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 70px rgba(40,45,55,.28), inset 0 0 0 3px #000;padding:10px}
.screen{border-radius:29px;overflow:hidden;background:linear-gradient(180deg,#fbf9f4,#f0ede5);height:704px;display:flex;flex-direction:column;position:relative}
.statusbar{height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:11px;color:rgba(20,25,32,.8);font-weight:700}

/* ── 상단 바: 로고+워드마크 1행, 부제 2행. 묶음 전체가 화면 정중앙 ── */
.appbar{
  height:56px;flex-shrink:0;position:relative;display:flex;align-items:center;
  padding:0 var(--sp-2);
}
.brand-lock{
  position:absolute;left:0;right:0;top:0;bottom:0;   /* 좌우 동일 인셋 — 화면 정중앙 */
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;pointer-events:none;
}
.wordmark{display:flex;align-items:center;gap:var(--sp-2)}
.applogo{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#ffd05c,#efb945);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bar-title{font-family:'Gowun Batang',serif;font-size:18px;font-weight:700;color:var(--ink);line-height:1}
.bar-sub{font-size:11px;font-weight:500;color:var(--ink-sub);line-height:1;white-space:nowrap}

.appbar .right{margin-left:auto;display:flex;z-index:1}
.textbtn{font-size:11px;font-weight:700;color:var(--ink-dim);padding:8px 8px;border-radius:var(--r-pill)}

.body16{padding:var(--sp-2) var(--sp-4);flex:1;overflow:hidden;display:flex;flex-direction:column;gap:var(--sp-3)}
.room-card{display:flex;align-items:center;gap:var(--sp-3);background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);padding:var(--sp-3) var(--sp-4)}
.thumb{width:48px;height:48px;border-radius:var(--r-cell);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;position:relative}
.thumb .dot{position:absolute;right:-3px;bottom:-3px;width:14px;height:14px;border-radius:50%;border:3px solid #fbf9f4}
.rc-main{flex:1;min-width:0}
.rc-name{font-size:15px;font-weight:700;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-prev{font-size:11px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-side{display:flex;flex-direction:column;align-items:flex-end;gap:var(--sp-1);flex-shrink:0}
.rc-time{font-size:10px;color:var(--ink-dim)}
.badge{min-width:18px;height:18px;border-radius:var(--r-pill);background:var(--postit);color:#1a1a1a;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 6px}
.fab{position:absolute;right:var(--sp-4);bottom:24px;width:56px;height:56px;border-radius:18px;background:var(--postit);color:#1a1a1a;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;transform:rotate(-4deg);box-shadow:0 10px 24px rgba(224,177,62,.45)}
.d10{display:block}
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="statusbar"><span>21:41</span><span>▲ ● ▮</span></div>
    <div class="appbar">
      <div class="brand-lock">
        <div class="wordmark">
          <div class="applogo">
            <svg class="d10" viewBox="0 0 100 104" width="13" height="14"><g stroke="#ffd05c" stroke-width="2.8" stroke-linejoin="round"><path d="M50,6 L9,54 L33,60 Z" fill="#23272e"/><path d="M9,54 L50,98 L33,60 Z" fill="#181c22"/><path d="M50,6 L91,54 L67,60 Z" fill="#2a2f38"/><path d="M91,54 L50,98 L67,60 Z" fill="#1d222a"/><path d="M50,6 L67,60 L50,98 L33,60 Z" fill="#23272e"/></g></svg>
          </div>
          <div class="bar-title">PbP</div>
        </div>
        <div class="bar-sub">진행 중인 세션 3</div>
      </div>
      <div class="right">
        <div class="textbtn">Aa</div>
        <div class="textbtn">참여</div>
      </div>
    </div>

    <div class="body16">
      <div class="room-card">
        <div class="thumb" style="background:linear-gradient(160deg,#a8c4da,#7d97ac)">🌊<i class="dot" style="background:#5f9ec7"></i></div>
        <div class="rc-main">
          <div class="rc-name">등대에서 만나요</div>
          <div class="rc-prev">카야 · 등불이 꺼지기 전에 도착할게.</div>
        </div>
        <div class="rc-side"><span class="rc-time">방금</span><span class="badge">2</span></div>
      </div>
      <div class="room-card">
        <div class="thumb" style="background:linear-gradient(160deg,#c3b1d6,#9c88b4)">🕯️<i class="dot" style="background:#8a6bb0"></i></div>
        <div class="rc-main">
          <div class="rc-name">라일락 관 살인사건</div>
          <div class="rc-prev">🎲 1d100&lt;=65 → 43 성공</div>
        </div>
        <div class="rc-side"><span class="rc-time">1시간 전</span></div>
      </div>
      <div class="room-card">
        <div class="thumb" style="background:linear-gradient(160deg,#a9c9b4,#7fa48c)">🌲<i class="dot" style="background:#5f9e78"></i></div>
        <div class="rc-main">
          <div class="rc-name">이끼의 숲 단편</div>
          <div class="rc-prev">잡담 · 오늘은 여기까지 할까요?</div>
        </div>
        <div class="rc-side"><span class="rc-time">어제</span></div>
      </div>
    </div>
    <div class="fab">＋</div>
  </div>
</div>
</body>
</html>
