<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PbP · 목업 — 채팅 상단 바 (GM/PL · 참여 인원)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gowun+Batang:wght@400;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
/* 디자인 토큰 — 라이트 모드 + v2 스페이싱.
   디자인 원칙: 센터 정렬 기본 · 패딩/마진 상하 동일 · 동류 항목은 같은 여백값 */
:root{
  --bg:#f4f2ec; --panel:#ffffff; --panel-2:#efeade;
  --line:rgba(20,25,32,.10); --ink:#23272e;
  --ink-sub:rgba(20,25,32,.72);   /* 상단 바 보조 정보 — 기존 .55에서 진하게 */
  --ink-dim:#6d7480;
  --theme:#5f9ec7;
  --bubble-me:#ffd9a8; --bubble-you:#bfe3f6; --bubble-ink:#10151c;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
  --r-card:16px; --r-pill:999px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#e9e5db;color:var(--ink);
  font-family:'Noto Sans KR',system-ui,sans-serif,'Noto Color Emoji';
  display:flex;gap:48px;align-items:center;justify-content:center;min-height:100vh;padding:40px;
}
.col{display:flex;flex-direction:column;align-items:center;gap:16px}
.tag{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--ink-dim);background:var(--panel);border:1px solid var(--line);border-radius:var(--r-pill);padding:6px 16px}
.phone{width:340px;flex-shrink:0;background:#05070a;border-radius:38px;border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 70px rgba(40,45,55,.28), inset 0 0 0 3px #000;padding:10px}
.screen{border-radius:29px;overflow:hidden;height:704px;display:flex;flex-direction:column;position:relative;
  background:
    radial-gradient(340px 200px at 82% 12%, rgba(255,238,190,.75), transparent 62%),
    radial-gradient(500px 340px at 20% 108%, rgba(148,186,214,.55), transparent 70%),
    linear-gradient(178deg,#b9d2e4 0%, #d6e4ee 45%, #eef3f6 100%);
}
.screen::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(249,251,253,.6),rgba(249,251,253,.22) 30%,rgba(249,251,253,.62));pointer-events:none}
.screen>*{position:relative}
.statusbar{height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:11px;color:rgba(20,25,32,.8);font-weight:700}

/* ── 상단 바: 타이틀 블록은 '항상 정중앙'(좌우 버튼 수와 무관), 상하 대칭 ── */
.appbar{
  height:56px;flex-shrink:0;position:relative;display:flex;align-items:center;
  padding:0 var(--sp-2);
  background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.35));
}
.icon-btn{width:40px;height:40px;border-radius:var(--r-pill);display:flex;align-items:center;justify-content:center;font-size:17px;color:rgba(20,25,32,.7);position:relative;z-index:1}
.appbar .right{margin-left:auto;display:flex;z-index:1}
.title-block{
  position:absolute;left:56px;right:96px;top:0;bottom:0;   /* 버튼 영역 제외한 중앙 */
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;                                                  /* 제목↔부제 — 기존 들뜬 행간 제거 */
  pointer-events:none;
}
.bar-title{font-family:'Gowun Batang',serif;font-size:15px;font-weight:700;color:var(--ink);line-height:1;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.bar-sub{font-size:11px;font-weight:500;color:var(--ink-sub);line-height:1;display:flex;align-items:center;gap:5px}
.bar-sub .dot{width:6px;height:6px;border-radius:2px;background:var(--theme)}

.msgs{flex:1;padding:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-3);overflow:hidden}
.mrow{display:flex;gap:var(--sp-2);align-items:flex-end}
.mrow.me{justify-content:flex-end}
.avatar{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:17px;background:var(--panel-2);border:1px solid rgba(255,255,255,.85);align-self:flex-start}
.mcol{display:flex;flex-direction:column;max-width:230px}
.mrow.me .mcol{align-items:flex-end}
.mname{font-size:11px;font-weight:700;margin-bottom:var(--sp-1);text-shadow:0 1px 3px rgba(255,255,255,.8)}
.mtime{font-size:10px;color:rgba(20,25,32,.5);flex-shrink:0;padding-bottom:2px}
.bubble{border-radius:4px var(--r-card) var(--r-card) var(--r-card);padding:var(--sp-2) var(--sp-3);font-size:13px;line-height:1.5;color:var(--bubble-ink);font-weight:500;width:fit-content;box-shadow:0 2px 8px rgba(60,70,85,.10)}
.mrow.me .bubble{border-radius:var(--r-card) 4px var(--r-card) var(--r-card)}
</style>
</head>
<body>

<div class="col">
  <div class="tag">GM(마스터) 시점</div>
  <div class="phone">
    <div class="screen">
      <div class="statusbar"><span>21:44</span><span>▲ ● ▮</span></div>
      <div class="appbar">
        <div class="icon-btn">←</div>
        <div class="title-block">
          <div class="bar-title">등대에서 만나요</div>
          <div class="bar-sub">GM <span class="dot"></span> 2명 참여 중</div>
        </div>
        <div class="right">
          <div class="icon-btn">↓</div>
          <div class="icon-btn">⚙</div>
        </div>
      </div>
      <div class="msgs">
        <div class="mrow">
          <div class="avatar">🌊</div>
          <div class="mcol">
            <div class="mname" style="color:#33719c">카야</div>
            <div class="bubble" style="background:var(--bubble-you)">등불 값이라니, 여긴 공영 등대잖아요.</div>
          </div>
          <div class="mtime">21:03</div>
        </div>
        <div class="mrow me">
          <div class="mtime">21:05</div>
          <div class="mcol">
            <div class="mname" style="color:#c07b1f">밤샘꾼</div>
            <div class="bubble" style="background:var(--bubble-me)">값은 이야기로 치르지.</div>
          </div>
          <div class="avatar">🌙</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="col">
  <div class="tag">PL(참여자) 시점</div>
  <div class="phone">
    <div class="screen">
      <div class="statusbar"><span>21:44</span><span>▲ ● ▮</span></div>
      <div class="appbar">
        <div class="icon-btn">←</div>
        <div class="title-block">
          <div class="bar-title">등대에서 만나요</div>
          <div class="bar-sub">PL <span class="dot"></span> 2명 참여 중</div>
        </div>
        <div class="right">
          <div class="icon-btn">↓</div>
          <div class="icon-btn">⚙</div>
        </div>
      </div>
      <div class="msgs">
        <div class="mrow">
          <div class="avatar">🌙</div>
          <div class="mcol">
            <div class="mname" style="color:#c07b1f">밤샘꾼</div>
            <div class="bubble" style="background:var(--bubble-me)">값은 이야기로 치르지.</div>
          </div>
          <div class="mtime">21:05</div>
        </div>
        <div class="mrow me">
          <div class="mtime">21:06</div>
          <div class="mcol">
            <div class="mname" style="color:#33719c">카야</div>
            <div class="bubble" style="background:var(--bubble-you)">…좋아요, 들어볼게요.</div>
          </div>
          <div class="avatar">🌊</div>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
