<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PbP · 목업 — 인용 말풍선 (쌍따옴표 대사)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gowun+Batang:wght@400;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
/* 디자인 토큰 — 라이트 모드 기준 (trpg-app-mockup-light.html + v2 스페이싱) */
:root{
  --bg:#f4f2ec; --panel:#ffffff; --panel-2:#efeade;
  --line:rgba(20,25,32,.10); --ink:#23272e; --ink-dim:#6d7480;
  --postit:#ffd05c; --accent:#e0b13e; --accent-ink:#a3781a;
  --theme:#5f9ec7;
  --bubble-me:#ffd9a8; --bubble-you:#bfe3f6; --bubble-ink:#10151c;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
  --r-card:16px; --r-pill:999px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#e9e5db;color:var(--ink);
  font-family:'Noto Sans KR',system-ui,sans-serif,'Noto Color Emoji';
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px;
}
.phone{width:340px;flex-shrink:0;background:#05070a;border-radius:38px;border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 70px rgba(40,45,55,.28), inset 0 0 0 3px #000;padding:10px}
.screen{border-radius:29px;overflow:hidden;height:704px;display:flex;flex-direction:column;position:relative;
  background:
    radial-gradient(340px 200px at 82% 12%, rgba(255,238,190,.75), transparent 62%),
    radial-gradient(500px 340px at 20% 108%, rgba(148,186,214,.55), transparent 70%),
    linear-gradient(178deg,#b9d2e4 0%, #d6e4ee 45%, #eef3f6 100%);
}
.screen::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(249,251,253,.6),rgba(249,251,253,.22) 30%,rgba(249,251,253,.62));pointer-events:none}
.screen>*{position:relative}
.statusbar{height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:11px;color:rgba(20,25,32,.8);font-weight:700}
.appbar{height:56px;flex-shrink:0;display:flex;align-items:center;gap:2px;padding:0 var(--sp-2);background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.35))}
.icon-btn{width:40px;height:40px;border-radius:var(--r-pill);display:flex;align-items:center;justify-content:center;font-size:17px;color:rgba(20,25,32,.7)}
.grow{flex:1;min-width:0}
.bar-title{font-family:'Gowun Batang',serif;font-size:15px;font-weight:700;color:var(--ink)}
.bar-sub{font-size:10px;color:rgba(20,25,32,.55);display:flex;align-items:center;gap:5px}

.msgs{flex:1;padding:var(--sp-3) var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-3);overflow:hidden}
.caption{align-self:center;font-size:10px;font-weight:700;letter-spacing:.12em;color:rgba(20,25,32,.45);background:rgba(255,255,255,.75);border:1px solid rgba(20,25,32,.07);border-radius:var(--r-pill);padding:3px 12px}
.mrow{display:flex;gap:var(--sp-2);align-items:flex-end}
.mrow.me{justify-content:flex-end}
.avatar{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:17px;background:var(--panel-2);border:1px solid rgba(255,255,255,.85);align-self:flex-start}
.mcol{display:flex;flex-direction:column;max-width:230px}
.mrow.me .mcol{align-items:flex-end}
.mname{font-size:11px;font-weight:700;margin-bottom:var(--sp-1);text-shadow:0 1px 3px rgba(255,255,255,.8)}
.mtime{font-size:10px;color:rgba(20,25,32,.5);flex-shrink:0;padding-bottom:2px}
.bubble{border-radius:4px var(--r-card) var(--r-card) var(--r-card);padding:var(--sp-2) var(--sp-3);font-size:13px;line-height:1.5;color:var(--bubble-ink);font-weight:500;width:fit-content;box-shadow:0 2px 8px rgba(60,70,85,.10)}
.mrow.me .bubble{border-radius:var(--r-card) 4px var(--r-card) var(--r-card)}

/* ── 인용 말풍선: 명조 쌍따옴표가 인용구처럼 크게 ──
   여는 “ 는 좌상단, 닫는 ” 는 우하단. 본문은 따옴표 폭만큼 들여쓴다 */
.bubble.quote{
  position:relative;
  padding:14px 24px 16px 26px;
}
.bubble.quote::before,
.bubble.quote::after{
  font-family:'Gowun Batang',serif;
  font-weight:700;
  font-size:30px;
  line-height:1;
  position:absolute;
  color:rgba(16,21,28,.32);   /* 말풍선 잉크의 옅은 톤 — 어떤 말풍선 색에도 얹힌다 */
}
.bubble.quote::before{content:"“";top:6px;left:8px}
.bubble.quote::after{content:"”";bottom:4px;right:8px}
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="statusbar"><span>21:44</span><span>▲ ● ▮</span></div>
    <div class="appbar">
      <div class="icon-btn">←</div>
      <div class="grow">
        <div class="bar-title">등대에서 만나요</div>
        <div class="bar-sub"><i style="width:8px;height:8px;border-radius:3px;background:var(--theme);display:inline-block"></i> 마스터</div>
      </div>
      <div class="icon-btn">↓</div>
      <div class="icon-btn">⚙</div>
    </div>

    <div class="msgs">
      <div class="caption">일반 말풍선</div>
      <div class="mrow">
        <div class="avatar">🌊</div>
        <div class="mcol">
          <div class="mname" style="color:#33719c">카야</div>
          <div class="bubble" style="background:var(--bubble-you)">등불 값이라니, 여긴 공영 등대잖아요.</div>
        </div>
        <div class="mtime">21:03</div>
      </div>

      <div class="caption">인용 말풍선 — 상대</div>
      <div class="mrow">
        <div class="avatar">🌊</div>
        <div class="mcol">
          <div class="mname" style="color:#33719c">카야</div>
          <div class="bubble quote" style="background:var(--bubble-you)">등불이 꺼지기 전에,<br>반드시 도착할게.</div>
        </div>
        <div class="mtime">21:04</div>
      </div>

      <div class="caption">인용 말풍선 — 나</div>
      <div class="mrow me">
        <div class="mtime">21:05</div>
        <div class="mcol">
          <div class="mname" style="color:#c07b1f">밤샘꾼</div>
          <div class="bubble quote" style="background:var(--bubble-me);border-radius:var(--r-card) 4px var(--r-card) var(--r-card)">값은 이야기로 치르지. 어젯밤 난파선 얘기, 듣고 싶지 않소?</div>
        </div>
        <div class="avatar">🌙</div>
      </div>

      <div class="caption">한 줄 — 짧은 대사</div>
      <div class="mrow me">
        <div class="mtime">21:06</div>
        <div class="mcol">
          <div class="mname" style="color:#c07b1f">밤샘꾼</div>
          <div class="bubble quote" style="background:var(--bubble-me);border-radius:var(--r-card) 4px var(--r-card) var(--r-card)">…약속하지.</div>
        </div>
        <div class="avatar">🌙</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
